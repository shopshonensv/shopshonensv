<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--CSP-START-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'none'">
<meta name="description" content="Conoce a Shop Shonen SV.">
<link rel="icon" href="logo.webp">
<!--CSP-END-->
<title>Sobre nosotros · Shop Shonen SV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<!--STYLE-START-->
<style>
/* Página independiente: misma identidad visual, sin nada de la tienda. */
:root{
  --ink:#14202a;--paper:#f6fafb;--panel:#ffffff;--teal:#00819e;--cream:#f4eab2;--sun:#ffd500;--muted:#5b6b75;--line:#d6e3e8;
  --f-display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --f-body:"M PLUS Rounded 1c",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --b:3px solid var(--ink);--gut:clamp(16px,4vw,40px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.ab-main{flex:1;width:100%}
img{max-width:100%;display:block}
.ab-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px var(--gut);border-bottom:var(--b);background:var(--paper)}
.ab-back{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border:var(--b);border-radius:999px;padding:10px 18px;font-weight:800;text-decoration:none;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.ab-back:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.ab-cta{display:flex;justify-content:center;padding:0 var(--gut) clamp(32px,6vw,56px)}
.ab-btn{display:inline-flex;background:var(--sun);color:var(--ink);border:var(--b);border-radius:999px;padding:14px 28px;font-weight:800;font-size:1.05rem;text-decoration:none;box-shadow:4px 4px 0 var(--ink)}
.ab-btn:hover,.ab-back:focus-visible,.ab-btn:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
:focus-visible{outline:3px solid #d9662a;outline-offset:3px}
.ab-top img{height:52px;width:auto}
.ab-hero{position:relative;overflow:hidden;isolation:isolate;background:var(--teal);border-bottom:var(--b);padding:clamp(40px,8vw,88px) var(--gut);text-align:center}
.ab-hero::before{content:"";position:absolute;inset:-60%;z-index:-1;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.12) 0deg 3deg,transparent 3deg 9deg)}
.ab-hero h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.4rem,8vw,5rem);line-height:1;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.ab-main{max-width:820px;margin:0 auto;padding:clamp(28px,6vw,56px) var(--gut)}
.ab-content:empty{min-height:220px;border:3px dashed var(--line);border-radius:14px;background:var(--panel)}
.ab-foot{border-top:var(--b);background:var(--ink);color:var(--cream);text-align:center;padding:24px var(--gut);font-size:.85rem}
.ab-foot p{margin:0}
</style>
<!--STYLE-END-->
</head>
<body>
<!--BODY-START-->
<header class="ab-top">
  <a href="index.html" class="ab-logo" aria-label="Ir a la tienda Shop Shonen SV"><img src="logo.webp" alt="Shop Shonen SV" width="520" height="252"></a>
  <a href="index.html" class="ab-back">Ir a la tienda <span aria-hidden="true">→</span></a>
</header>
<section class="ab-hero">
  <h1>Sobre nosotros</h1>
</section>
<main class="ab-main">
  <!-- Aquí irá la historia de Shop Shonen SV. Escribe los párrafos dentro de este div. -->
  <div class="ab-content"></div>
</main>
<div class="ab-cta"><a href="index.html" class="ab-btn">Visitar la tienda</a></div>
<footer class="ab-foot">
  <p>Shop Shonen SV · Hacemos tus ideas nuestra pasión</p>
</footer>
<!--BODY-END-->
</body>
</html>
